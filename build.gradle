plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.17-kappa'
}

group = 'com.apocollis.chunksteward'
version = '1.1'
base {
    archivesName.set('ChunkSteward')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// Generator mods the dimension mixins target. Compile only, never shipped: copy the DEVBOX jars into libs/mods.
configurations {
    modCompileOnly
    compileOnly.extendsFrom modCompileOnly
}

unimined.minecraft {
    version '1.12.2'

    mappings {
        mcp('stable', '39-1.12')
    }

    cleanroom {
        loader('0.5.7-alpha')
    }

    mods {
        remap(configurations.modCompileOnly)
    }

    defaultRemapJar = true
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs', 'libs/mods'
    }
}

dependencies {
    // Unimined remaps resolved module artifacts only, so each jar is a flatDir module rather than a file dependency.
    (file('libs/mods').listFiles() ?: []).findAll { it.name.endsWith('.jar') }.sort { it.name }.each { jar ->
        modCompileOnly(name: jar.name - '.jar')
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            "Specification-Title": "chunksteward",
            "Specification-Vendor": "apocollis",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "apocollis",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "ModType": "CRL",
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true",
            "MixinConfigs": "mixins.chunksteward.early.json"
        ])
    }
}

processResources {
    inputs.property 'version', version
    filesMatching('mcmod.info') {
        expand(version: project.version)
    }
}

tasks.register('verifyReleaseJar') {
    dependsOn 'remapJar'
    doLast {
        def jarFile = layout.buildDirectory.file("libs/ChunkSteward-${version}.jar").get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("Missing remapped jar: ${jarFile}")
        }
        def modSource = file('src/main/java/com/apocollis/chunksteward/ChunkSteward.java').text
        if (!modSource.contains("VERSION = \"${version}\"")) {
            throw new GradleException("ChunkSteward.VERSION does not match build.gradle version ${version}")
        }
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            if (zip.getEntry("mixins.chunksteward.refmap.json") == null) {
                throw new GradleException("mixins.chunksteward.refmap.json missing from ${jarFile.name}")
            }
            if (zip.getEntry("mixins.chunksteward.early.json") == null) {
                throw new GradleException("mixins.chunksteward.early.json missing from remapped jar")
            }
            if (zip.getEntry("mixins.chunksteward.depths.json") == null) {
                throw new GradleException("mixins.chunksteward.depths.json missing from remapped jar")
            }
            if (zip.getEntry("mixins.chunksteward.rtg.json") == null) {
                throw new GradleException("mixins.chunksteward.rtg.json missing from remapped jar")
            }
            ["netherex", "netherapi", "aurorian", "atum", "twilight", "aether", "beneath", "betweenlands", "emptiness", "endexpansion"].each { name ->
                def entry = "mixins.chunksteward.${name}.json"
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("${entry} missing from remapped jar")
                }
            }
            if (zip.getEntry("com/apocollis/chunksteward/ChunkStewardLateMixinLoader.class") == null) {
                throw new GradleException("ChunkStewardLateMixinLoader missing from remapped jar")
            }
            def refmapText = zip.getInputStream(zip.getEntry("mixins.chunksteward.refmap.json")).getText("UTF-8")
            if (!refmapText.contains("MixinLatePopulatingChunk") || !refmapText.contains("func_185931_b")) {
                throw new GradleException("refmap has no entry for the RTG doPopulate generator invoke (func_185931_b)")
            }
            zip.entries().each { e ->
                if (!e.name.endsWith(".class")) {
                    return
                }
                def stream = zip.getInputStream(e)
                def bytes = stream.readAllBytes()
                stream.close()
                int major = ((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)
                if (major != 65) {
                    throw new GradleException(
                            "${e.name} class major ${major}, expected 65 (Java 21). Do not change options.release.")
                }
                // Mixin refuses to load a class from a mixin package unless it is a mixin or an accessor, which crashes
                // the game at startup. Interfaces a mixin implements belong in another package.
                if (e.name.startsWith("com/apocollis/chunksteward/mixin/")) {
                    def rest = e.name.substring("com/apocollis/chunksteward/mixin/".length())
                    if (rest.endsWith(".class") && !rest.contains("/") && !rest.startsWith("Mixin") && !rest.startsWith("Accessor")) {
                        throw new GradleException("${e.name} is a plain class in a mixin package; Mixin cannot load it. " +
                                "Move it out of com.apocollis.chunksteward.mixin")
                    }
                }
                // Generator mods are compile-only (libs/mods). Only late, class-gated mixin configs and the loader's
                // presence probes may name their types; anything else would fail to load in a pack without the mod.
                def lateOnly = ["com/apocollis/chunksteward/mixin/dims/", "com/apocollis/chunksteward/mixin/endexpansion/",
                                "com/apocollis/chunksteward/mixin/rtg/", "com/apocollis/chunksteward/depths/",
                                "com/apocollis/chunksteward/ChunkStewardLateMixinLoader"]
                if (lateOnly.any { e.name.startsWith(it) }) {
                    return
                }
                def text = new String(bytes, "ISO-8859-1")
                ["git/jbredwards/", "logictechcorp/", "com/example/structure/", "com/shiroroku/", "com/teammetallurgy/",
                 "thebetweenlands/", "sayys/depthsupdate/", "com/apocollis/aqtweaks/"].each { pkg ->
                    if (text.contains(pkg)) {
                        throw new GradleException("${e.name} references ${pkg}; generator mods are optional, so only " +
                                "class-gated mixin configs may name their types (look them up by name instead)")
                    }
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyReleaseJar'
}
