plugins {
    id 'java'
    id 'xyz.wagyourtail.unimined' version '1.4.17-kappa'
}

group = 'com.apocollis.chunksteward'
version = '1.1'
base {
    archivesName.set('ChunkSteward')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

unimined.minecraft {
    version '1.12.2'

    mappings {
        mcp('stable', '39-1.12')
    }

    cleanroom {
        loader('0.5.7-alpha')
    }

    defaultRemapJar = true
}

repositories {
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            "Specification-Title": "chunksteward",
            "Specification-Vendor": "apocollis",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor": "apocollis",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            "ModType": "CRL",
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true",
            "MixinConfigs": "mixins.chunksteward.early.json"
        ])
    }
}

processResources {
    inputs.property 'version', version
    filesMatching('mcmod.info') {
        expand(version: project.version)
    }
}

tasks.register('verifyReleaseJar') {
    dependsOn 'remapJar'
    doLast {
        def jarFile = layout.buildDirectory.file("libs/ChunkSteward-${version}.jar").get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("Missing remapped jar: ${jarFile}")
        }
        def modSource = file('src/main/java/com/apocollis/chunksteward/ChunkSteward.java').text
        if (!modSource.contains("VERSION = \"${version}\"")) {
            throw new GradleException("ChunkSteward.VERSION does not match build.gradle version ${version}")
        }
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            if (zip.getEntry("mixins.chunksteward.refmap.json") == null) {
                throw new GradleException("mixins.chunksteward.refmap.json missing from ${jarFile.name}")
            }
            if (zip.getEntry("mixins.chunksteward.early.json") == null) {
                throw new GradleException("mixins.chunksteward.early.json missing from remapped jar")
            }
            if (zip.getEntry("mixins.chunksteward.rtg.json") == null) {
                throw new GradleException("mixins.chunksteward.rtg.json missing from remapped jar")
            }
            if (zip.getEntry("com/apocollis/chunksteward/ChunkStewardLateMixinLoader.class") == null) {
                throw new GradleException("ChunkStewardLateMixinLoader missing from remapped jar")
            }
            def refmapText = zip.getInputStream(zip.getEntry("mixins.chunksteward.refmap.json")).getText("UTF-8")
            if (!refmapText.contains("MixinLatePopulatingChunk") || !refmapText.contains("func_185931_b")) {
                throw new GradleException("refmap has no entry for the RTG doPopulate generator invoke (func_185931_b)")
            }
            zip.entries().each { e ->
                if (!e.name.endsWith(".class")) {
                    return
                }
                def stream = zip.getInputStream(e)
                def bytes = stream.readAllBytes()
                stream.close()
                int major = ((bytes[6] & 0xff) << 8) | (bytes[7] & 0xff)
                if (major != 65) {
                    throw new GradleException(
                            "${e.name} class major ${major}, expected 65 (Java 21). Do not change options.release.")
                }
            }
        } finally {
            zip.close()
        }
    }
}

tasks.named('check') {
    dependsOn 'verifyReleaseJar'
}
